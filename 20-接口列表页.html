<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的 GitHub 仓库</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background-color: #f5f7fa;

    .app {

    #search {

    #status {

    #list li {

      border: 1px dashed #dcdfe6;
      background-color: #ffffff;

    }

    .repo-name {

<body>
  <div class="app">
    <h1>我的 GitHub 仓库</h1>
    <p class="subtitle">阶段 0 · 模块 3 产出 · 龙丹丹</p>

    <input id="search" type="text" placeholder="搜索仓库名…">
    <p id="status"></p>
    <ul id="list"></ul>
    <p class="count" id="count"></p>
  </div>

  <script>
    /* ===== 接口地址（想多看几条数据，可以把用户名换成 "vuejs" 试一次）===== */
    const USER = "longdandan-dev";
    const API = "https://api.github.com/users/" + USER + "/repos";

    /* ---- TODO 题1 + 题6：把数据要回来 ----
       写一个 async 函数 loadRepos()，里面：
         1. 先抓元素：搜索框、状态行、列表、统计行
         2. 请求前先把状态行写成"加载中…"
         3. await fetch(API)，拿到 res
         4. 判断 res.ok，不 ok 就 throw new Error(...)
         5. await res.json() 拿到 data（这就是仓库数组）
         6. 把 data 存进一个变量 repos（搜索过滤要用它）
         7. 渲染列表（下一题）
         8. 状态行清空
       最后在下面调用一次 loadRepos();
       参考：跟练 4 的 getRepos 就是这套流程。
       在下面敲：
    */
const search = document.querySelector("#search");
const status = document.querySelector("#status");
const list = document.querySelector("#list");
const count = document.querySelector("#count");
 let repos = [];

async function loadRepos(){
  try{
    status.textContent= "加载中..."; 
   const res =  await fetch(API)
      if(!res.ok) {
        throw new Error("接口返回" + res.status);
      }
      const data = await res.json();//需要解析第二遍
      repos = data;
      render(repos);
      status.classList.remove("error");
      status.textContent ="";
    }catch (err){
      status.textContent = "出错了：" + err.message;
      status.classList.add("error");
      console.log("失败",err.message);
    }
}
loadRepos();



    /* ---- TODO 题2：每条长什么样 ----
       写一个 render(list) 函数：
         1. 先清空列表容器（innerHTML = ""）
         2. list.forEach 每一条造一个 <li>，里面放三块：
              仓库名：<a class="repo-name">，文字是 item.name，href 用 item.html_url
              描述：  <p class="repo-desc">，文字是 item.description；
                      描述是 null 的时候，显示"还没有写描述"（提示：|| 兜底）
              星星：  <p class="repo-meta">，文字写成 "⭐ 0 · JavaScript" 这种
                      （星星用 item.stargazers_count，语言用 item.language，
                        语言是 null 的时候写"其它"）
         3. 造好的 li 用 append 放进列表容器
       参考：跟练 5 的 render 和你待办清单那次，配方一样。
       在下面敲：
    */
function render(repos){
  list.innerHTML = "";
  repos.forEach((repo)=>{
    const li = document.createElement("li");

    const reponame = document.createElement("a");
    reponame.classList.add("repo-name");
    reponame.textContent= repo.name;
    reponame.href = repo.html_url; 
    li.append(reponame);

    const repodesc = document.createElement("p");
    repodesc.classList.add("repo-desc");
    repodesc.textContent= repo.description || "还没有写描述";
    li.append(repodesc);

    const repometa = document.createElement("p");
    repometa.classList.add("repo-meta");
    repometa.textContent="⭐"  + repo.stargazers_count + "." +(repo.language || "其他"); 
    li.append(repometa);
    
    list.append(li);
  })

  count.textContent = "共" + repos.length + "个仓库";
}



    /* ---- TODO 题3：失败不白屏 ----
       在 loadRepos 里加 try / catch：
         catch 里做两件事：状态行写上错误原因，并且给它加上 class="error"（变红）
         （成功的时候要把 error 这个类去掉，不然下一次成功还是红的）
       参考：跟练 4 的 catch + 跟练 6 的状态行写法。
    */






    /* ---- TODO 题4 + 题5：搜索过滤 ----
       给搜索框挂 input 事件，每次打字都做一次过滤：
         1. 取输入框的值，trim() 去空格，再 toLowerCase() 变小写
         2. 用 repos.filter(...) 过滤出"仓库名里包含这个关键字"的
            （仓库名也要 toLowerCase 才有意义）
         3. 关键字是空的时候，就显示全部
         4. 过滤结果为空 → 显示"没有匹配的仓库"（可以直接造一个 li，
            给它加上 class="empty"，或者写到状态行里）
         5. 用过滤后的结果重新 render 一遍
       参考：模块 1 的 filter + 模块 2 的 render 老配方。
       在下面敲：
    */
const  input= document.querySelector("#search");
input.addEventListener("input",function(){
  const keyword = input.value.trim().toLowerCase();
  if(keyword === ""){
    render(repos);
    return;
  }

  const result = repos.filter((repo) => repo.name.toLowerCase().includes(keyword));
  
  if(result.length === 0){
    const li = document.createElement("li");
    li.classList.add("empty");
    li.textContent= "没有匹配的仓库";
    list.innerHTML = "";
    list.append(li);
    return;
  }
  render(result);
})





    /* ===== 写完之后 =====
       1. 浏览器里把上面"验收方式"的 6 步走一遍
       2. 终端里跑：node 检查异步.js（会多出一组"产出"检查）
       3. 把两部分结果都发我
    */
  </script>
</body>
</html>
