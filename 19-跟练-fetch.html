<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>fetch 跟练</title>
  <style>
    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background-color: #f5f7fa;
      padding: 24px;
    }
    h1 { color: #1a73e8; font-size: 20px; }
    .desc { color: #888888; font-size: 14px; }

    #status { color: #1a73e8; font-size: 14px; }

    #list {
      list-style: none;
      padding-left: 0;
      max-width: 520px;
    }
    #list li {
      background-color: #ffffff;
      border: 1px solid #e6e8eb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>我的仓库（fetch 跟练）</h1>
  <p class="desc">页面上这几块 HTML 不用改，你只在 &lt;script&gt; 里写 JS。</p>

  <!-- 跟练 6 会用到这个：一开始先让它显示"加载中…" -->
  <p id="status">（这里将来显示加载中 / 出错提示）</p>

  <ul id="list"></ul>

  <script>
    const list = document.querySelector("#list");
const status = document.querySelector("#status");
    /* ============================================================
       跟练 1：最小的一次请求（then 版）
       ------------------------------------------------------------
       聊天里给你的三行代码敲在下面。
       跑完看控制台：应该打印出"拿到几条：1"。
       先感受一下：fetch 后面跟的是 .then，不是直接给你数据——
       因为 fetch 返回的就是一张"饭票"（Promise）。
       ============================================================ */
    fetch("https://api.github.com/users/longdandan-dev/repos")
      .then((res) => res.json())
      .then((data)=> console.log("拿到几条：",data.length));




    /* ============================================================
       跟练 2：async / await 版（为什么有两个 await）
       ------------------------------------------------------------
       聊天里的 getRepos 函数敲在下面，末尾记得 getRepos();
       第一个 await：等服务器把响应头送回来（res）
       第二个 await：等响应体（JSON 文字）解析成 JS 数据（data）
       少一个 await，你拿到的又是一张饭票。
       ============================================================ */
async function showMyRepos(){
  const res = await fetch("https://api.github.com/users/longdandan-dev/repos");
  console.log("状态码",res.status);
  const data = await res.json();
  console.log("数据长这样",data[0]);

  console.log(data[0].name,data[0].html_url,data[0].description);
}
showMyRepos();




    /* ============================================================
       跟练 3：看看数据长什么样
       ------------------------------------------------------------
       在跟练 2 的 data 后面，跟着打印这四个字段：
         data[0].name              （仓库名）
         data[0].html_url          （仓库网址）
         data[0].description       （描述，可能是 null）
         data[0].stargazers_count  （星星数）
       先把字段名认出来，跟练 5 画页面就要用它们。
       ============================================================ */





    /* ============================================================
       跟练 4（★ 最重要）：404 不会自己进 catch
       ------------------------------------------------------------
       聊天里的 getRepos(user) 函数敲在下面，然后调用两次：
         getRepos("longdandan-dev");                  → 成功
         getRepos("zhegeyonghumingbukenengcunzai");   → 404
       重点看：加了 if (!res.ok) 之后，404 才会走到 catch。
       不加这一句，404 会被当成"请求成功"，你会在后面莫名其妙地报错。
       ============================================================ */
async function getRepos(user){
  try {
    status.textContent = "加载中...";
    const res = await fetch("https://api.github.com/users/" + user +"/repos");

    if(!res.ok){
      throw new Error("接口返回" + res.status);
    }

    const data = await res.json();
    console.log("成功，拿到",data.length,"条");
    render(data);
    status.textContent = "";

  }
  catch(err){
    console.log("失败",err.message);
    status.textContent = "出错了，原因：" + err.message;
  }
}

getRepos("longdandan-dev");
getRepos("zhegeyonghubucunzai");




    /* ============================================================
       跟练 5：把数据画到页面上（render 老配方）
       ------------------------------------------------------------
       聊天里的 render(repos) 函数敲在下面（造 li 的写法和你待办清单那次一样）。
       然后在跟练 4 请求成功的地方调用它，把 data 传进去。
       跑完页面上应该出现一条 li，写着 js-practice。
       ============================================================ */

function render(repos){
  list.innerHTML="";
  repos.forEach((repo)=>{
 const li = document.createElement("li");
 li.textContent = repo.name + "("+ repo.language + ")";
 list.append(li)
  });
 
}





    /* ============================================================
       跟练 6（加分）：加载中提示
       ------------------------------------------------------------
       页面上那个 <p id="status"> 就是干这个的：
         请求开始前：status.textContent = "加载中…";
         请求成功后：status.textContent = "";（清空）
         请求失败后：status.textContent = "出错了，原因：" + err.message;
       为什么值得做：网络要几百毫秒，页面这段时间是空的，
       用户会以为页面坏了——这就是"loading"存在的唯一理由。
       ============================================================ */

          为什么 fetch 要写两个 await？分别等的是什么？
    */
