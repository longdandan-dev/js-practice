<!-- ============================================================
     学习日 4 · 独立作品：自我介绍页面
     ------------------------------------------------------------
     这个文件里我只放了提示注释，标签和内容全部由你自己写。
     别整段复制跟练页，自己敲一遍才知道哪块是哪块。

     内容清单（写的时候对着打勾）：
       1. h1      你的名字
       2. p       一句话介绍：学校专业 + 现在在学什么
       3. h2      小标题"我在学什么" + ul/li 列出你学过的技能
       4. h2      小标题"找我" + a 链接到你的 GitHub
       5. 用 div    把上面几块分成区域
       6. head 里记得有 meta charset 和 title

     写完这三步：
       1. Ctrl + S 保存
       2. 右键这个文件 → Open with Live Server，看效果
       3. 终端运行：node 检查HTML.js
     ============================================================ -->
     <!DOCTYPE html>
     <html lang="zh-CN">
     <head>
      <meta charset="UTF-8">
      <title>自我介绍</title>
     </head>
     <body>
      <div>
      <h1>龙丹丹</h1>
    </div>
    <div>
      <p>毕业于大连大学，2026届软件工程专业毕业生。在校期间系统学过数据库、软件工程原理、数据结构、Java、C、C++等。目前在深圳，求职意向：前端开发（Vue 方向）。</p>
    </div>
    <div>
      <h2>我在学</h2>
      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Vue</li>
      </ul>
    </div>
    <div>
      <h2>找我</h2>
      <a href="https://github.com/longdandan-dev">我的GitHub</a>
    </div>
     </body>
     </html>
